services:
  uygulama:
    build: .
    container_name: tarimsal-proje-takip
    restart: unless-stopped
    ports:
      - "1763:1763"
    environment:
      - PORT=1763
      - MONGO_URI=mongodb://veritabani:27017/tpts
    depends_on:
      - veritabani

  veritabani:
    image: mongo:7
    container_name: tarimsal-proje-takip-db
    restart: unless-stopped
    volumes:
      - tpts-veri:/data/db

  # Otomatik güncelleme: GitHub'da yeni sürüm olunca çeker ve
  # "docker compose up -d --build" ile uygulamayı yeniden kurar (deploy/guncelleyici.sh).
  # Proje klasörü sunucudaki yoluyla aynı yolda bağlanır (proje ve volume adları değişmesin).
  guncelleyici:
    image: docker:27-cli
    container_name: tarimsal-proje-takip-guncelleyici
    restart: unless-stopped
    working_dir: ${PWD}
    entrypoint: ["sh", "deploy/guncelleyici.sh"]
    environment:
      - GUNCELLEME_ARALIGI=300
      - GUNCELLEME_DALI=main
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tpts-veri:
